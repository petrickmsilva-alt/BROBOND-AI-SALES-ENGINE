[project]
name = "brobond-api"
version = "0.1.0"
description = "BROBOND AI Sales Engine API"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "redis==5.2.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.6",
    "black==24.10.0",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "S", "C4", "SIM", "RUF"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN"]
"app/application/dto/auth_dto.py" = ["S105"]
"app/core/config.py" = ["S105"]
"app/core/security.py" = ["S105", "S107"]
"app/seed.py" = ["S311"]
"scripts/*" = ["S310", "T201"]
"alembic/*" = ["ANN", "E501"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
