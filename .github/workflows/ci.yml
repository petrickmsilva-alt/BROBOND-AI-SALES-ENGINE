name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements*.txt') }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy app scripts

      - name: Pytest (with coverage gate)
        run: pytest

  contract-tests:
    name: API contract tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Contract tests (OpenAPI snapshot + endpoint contracts)
        run: pytest tests/contracts -p no:cacheprovider

  docker-smoke:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create .env
        working-directory: .
        run: cp .env.example .env

      - name: Build images
        working-directory: .
        run: docker compose build api

      - name: Start core services
        working-directory: .
        run: docker compose up -d postgres redis api

      - name: Wait for the API and run smoke checks
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python scripts/smoke.py --base-url http://localhost:8000

      - name: Dump logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v
