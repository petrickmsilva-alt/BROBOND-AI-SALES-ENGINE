name: brobond-ai-sales

services:
  postgres:
    image: postgres:16-alpine
    container_name: brobond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brobond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brobond}
      POSTGRES_DB: ${POSTGRES_DB:-brobond}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-brobond} -d ${POSTGRES_DB:-brobond}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [brobond]

  redis:
    image: redis:7-alpine
    container_name: brobond-redis
    restart: unless-stopped
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [brobond]

  ollama:
    image: ollama/ollama:latest
    container_name: brobond-ollama
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/usr/local/bin/brobond-entrypoint.sh:ro
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    entrypoint: ['/bin/sh', '/usr/local/bin/brobond-entrypoint.sh']
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [brobond]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    container_name: brobond-api
    restart: unless-stopped
    command: ['/app/entrypoint.sh']
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brobond}:${POSTGRES_PASSWORD:-brobond}@postgres:5432/${POSTGRES_DB:-brobond}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      N8N_BASE_URL: http://n8n:5678
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [brobond]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: brobond-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_started
    networks: [brobond]

  n8n:
    image: n8nio/n8n:latest
    container_name: brobond-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-brobond}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-brobond}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      BROBOND_API_URL: http://api:8000
    ports:
      - '${N8N_PORT:-5678}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [brobond]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:

networks:
  brobond:
    driver: bridge
